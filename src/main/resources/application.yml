server:
  port: 8080

spring:
  application:
    name: chatbox

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/greenshield_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: -1
      max-request-size: 47185920
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  gemini:
    api:
      key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.1-flash-lite,gemma-4-31b-it,gemma-4-26b-a4b-it,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview}
      image-models: ${GEMINI_IMAGE_MODELS:gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.6-flash,gemini-3.5-flash,gemini-3-flash-preview}

google:
  tts:
    api-key: ${GOOGLE_TTS_API_KEY:}

# Green AI: số ảnh tối đa hệ thống cho phép gen trong 1 ngày (toàn cục)
app:
  ai:
    daily-image-limit: ${DAILY_AI_IMAGE_LIMIT:20}
    daily-audio-limit: ${DAILY_AI_AUDIO_LIMIT:200}
    chat:
      max-knowledge-chars: ${GEMINI_MAX_KNOWLEDGE_CHARS:12000}
      max-knowledge-chunks: ${GEMINI_MAX_KNOWLEDGE_CHUNKS:8}
      max-knowledge-chunk-chars: ${GEMINI_MAX_KNOWLEDGE_CHUNK_CHARS:4500}
      max-history-messages: ${GEMINI_MAX_HISTORY_MESSAGES:8}
      max-history-chars: ${GEMINI_MAX_HISTORY_CHARS:4000}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:512}
      temperature: ${GEMINI_TEMPERATURE:0.3}
      retries-per-model: ${GEMINI_RETRIES_PER_MODEL:1}
  product:
    image-storage: ${PRODUCT_IMAGE_STORAGE:local}
    upload-dir: ${PRODUCT_UPLOAD_DIR:uploads/products}
    public-base-url: ${PRODUCT_PUBLIC_BASE_URL:/uploads/products}

# Cloudinary - get from https://console.cloudinary.com
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
